name: Build Pocket Desktop IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project PocketDesktop.xcodeproj \
            -scheme PocketDesktop \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO || true

      - name: Build App for iOS Device
        run: |
          xcodebuild clean build \
            -project PocketDesktop.xcodeproj \
            -scheme PocketDesktop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package IPA (Sideloadable Archive)
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/PocketDesktop.app Payload/
          zip -r -9 PocketDesktop.ipa Payload
          ls -lh PocketDesktop.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDesktop-IPA
          path: PocketDesktop.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Pocket Desktop iOS v1.0.0
          body: |
            ## 📱 Pocket Desktop for iPhone (iOS 17+)
            
            Ready-to-install sideloadable `.ipa` build.
            
            ### Installation Instructions:
            1. Download `PocketDesktop.ipa` below.
            2. Install using your preferred sideloading tool:
               - **AltStore** (Open AltStore > My Apps > `+` > select `PocketDesktop.ipa`)
               - **Sideloadly** (Drag & drop `PocketDesktop.ipa`, enter Apple ID, click Start)
               - **TrollStore** (Direct install without re-signing if jailbroken/TrollStore supported)
               - **Scarlet** / **ESign** / **GBox**
            3. Enjoy full mobile-first control over your desktop PC!
          files: PocketDesktop.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
